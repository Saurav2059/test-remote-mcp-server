[project]
name = "test-remote-mcp-server"
version = "0.1.0"
description = "Remote FastMCP server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "categories.json"
]